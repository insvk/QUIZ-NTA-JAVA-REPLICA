<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | GlassQuiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glass-panel dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="welcomeText">Student Portal</h2>
            <button onclick="logout()" style="width: auto; padding: 8px 16px;">Logout</button>
        </div>

        <h3>Allowed Active Assessments</h3>
        <div class="card-grid" id="testList"></div>

        <h3 style="margin-top: 40px;">Your Past Test Performance</h3>
        <div class="card-grid" id="pastAttempts"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
