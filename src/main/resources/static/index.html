<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPSTONE JAVA QUIZ | Member Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="member-login-body">
    
    <!-- TOP RIGHT LOGO -->
    <img src="https://images.squarespace-cdn.com/content/v1/6268bb18d74de925d9ff1bb9/afb1eaa4-6ab6-4d8a-b4f7-6ccd0a0776d9/Saveetha+simats.png" alt="Saveetha Logo" class="top-right-logo">

    <div class="auth-wrapper">
        <div class="auth-container">
            
            <!-- LEFT SIDE: Illustration -->
            <div class="auth-left-panel">
                <div class="graphic-circle">
                    <!-- Decorative Shapes -->
                    <div class="deco-shape circle-blue"></div>
                    <div class="deco-shape triangle-green"></div>
                    <div class="deco-shape triangle-green-small"></div>
                    <div class="deco-shape circle-blue-small"></div>
                    <div class="deco-shape square-grey"></div>
                    
                    <!-- Laptop SVG Replica -->
                    <svg viewBox="0 0 200 150" width="200" height="150" class="laptop-svg">
                        <!-- Laptop Base -->
                        <path d="M10,130 h180 v5 a5,5 0 0 1 -5,5 h-170 a5,5 0 0 1 -5,-5 z" fill="#e0e0e0"/>
                        <!-- Laptop Screen -->
                        <rect x="25" y="30" width="150" height="100" rx="4" fill="#4a5568"/>
                        <!-- Screen Inner -->
                        <rect x="30" y="35" width="140" height="90" fill="#374151"/>
                        <!-- User Icon on Screen -->
                        <circle cx="100" cy="70" r="12" fill="none" stroke="#9ca3af" stroke-width="3"/>
                        <path d="M75,110 c0,-15 10,-25 25,-25 s25,10 25,25" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <!-- RIGHT SIDE: Forms -->
            <div class="auth-right-panel">
                
                <!-- LOGIN FORM -->
                <div id="loginBox" class="form-box">
                    <h2>Member Login</h2>
                    
                    <div class="pill-input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="text" id="userId" placeholder="Username or Admin ID" required>
                    </div>

                    <div class="pill-input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" id="pwd" placeholder="Password" required>
                        <span class="eye-btn" onclick="togglePwd('pwd')">👁️</span>
                    </div>

                    <button class="btn-login-green" onclick="login()">LOGIN</button>
                    
                    <p class="forgot-link">Forgot Username / Password?</p>
                    
                    <div class="bottom-link-area">
                        <p class="switch-form-link" onclick="toggleAuth()">Create your Account &rarr;</p>
                    </div>
                </div>

                <!-- REGISTRATION FORM (Hidden by default) -->
                <div id="regBox" class="form-box hidden">
                    <h2>Create Account</h2>
                    
                    <div class="pill-input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <input type="text" id="regName" placeholder="Full Name" required>
                    </div>

                    <div class="pill-input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="email" id="regEmail" placeholder="Email Address" required>
                    </div>

                    <div class="pill-input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <input type="text" id="regUserId" placeholder="Choose Username" required>
                    </div>

                    <div class="pill-input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" id="regPwd" placeholder="Password" required>
                        <span class="eye-btn" onclick="togglePwd('regPwd')">👁️</span>
                    </div>

                    <div class="pill-input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" id="regCpwd" placeholder="Confirm Password" required>
                        <span class="eye-btn" onclick="togglePwd('regCpwd')">👁️</span>
                    </div>

                    <div class="pill-input-group" style="padding: 5px 20px;">
                        <input type="file" id="regPic" accept="image/*" style="padding: 10px 0; font-size:12px;">
                    </div>

                    <button class="btn-login-green" onclick="register()">SIGN UP</button>
                    
                    <div class="bottom-link-area">
                        <p class="switch-form-link" onclick="toggleAuth()">&larr; Back to Login</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
