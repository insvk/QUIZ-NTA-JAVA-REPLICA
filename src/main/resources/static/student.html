<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | GlassQuiz</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-dark-body">
    
    <div class="dark-layout">
        
        <!-- NARROW DARK SIDEBAR -->
        <aside class="dark-sidebar" id="sidebar">
            <div class="sidebar-logo-area">
                <!-- Green Triangle Logo for Student -->
                <svg viewBox="0 0 24 24" width="32" height="32" fill="#10b981"><path d="M12 2L2 20h20L12 2z"/></svg>
            </div>
            <div class="sidebar-menu">
                <a href="#" class="menu-item active" onclick="switchView('view-dashboard', this)" title="Dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </a>
                <a href="#" class="menu-item" onclick="switchView('view-profile', this); loadProfile();" title="My Profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="#" class="menu-item" onclick="switchView('view-results', this); loadStudentAttempts();" title="My Results">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                </a>
            </div>
            <div class="sidebar-bottom">
                <a href="#" class="menu-item" onclick="logout()" title="Logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="dark-main">
            
            <!-- TOP NAVBAR -->
            <nav class="dark-navbar">
                <div class="nav-left">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                </div>
                <div class="nav-right">
                    <div class="admin-profile" style="display: flex; align-items: center; gap: 12px;">
                        <img id="topNavProfilePic" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYTBhYWJmIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0yMCAyMXYtMmE0IDQgMCAwIDAtNC00SDhhNCA0IDAgMCAwLTQgNHYyIj48L3BhdGg+PGNpcmNsZSBjeD0iMTIiIGN5PSI3IiByPSI0Ij48L2NpcmNsZT48L3N2Zz4=" alt="Student">
                        <div style="display: flex; flex-direction: column;">
                            <strong id="studentNameDisplay" style="color: #e4e4e7; font-size: 13px;">STUDENT</strong>
                            <span id="admissionIdDisplay" style="color: #a1a1aa; font-size: 11px;">Reg No: 0000000</span>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- DYNAMIC VIEWS -->
            <div class="dark-content">
                
                <!-- 1. DASHBOARD VIEW (Tests) -->
                <div id="view-dashboard" class="admin-view active">
                    <h2 class="page-title mb-20">Available Examinations</h2>
                    
                    <h3 class="panel-title">Live Tests</h3>
                    <div class="form-grid mb-20" id="liveTestsContainer"></div>

                    <h3 class="panel-title mt-20">Upcoming Tests</h3>
                    <div class="form-grid" id="upcomingTestsContainer"></div>
                </div>

                <!-- 2. MY PROFILE VIEW -->
                <div id="view-profile" class="admin-view">
                    <h2 class="page-title mb-20">My Profile</h2>
                    <div class="dark-panel profile-card-wrapper" style="max-width: 500px; margin: 0 auto; text-align: center;">
                        <div class="profile-pic-container">
                            <img id="profileDetailedPic" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYTBhYWJmIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0yMCAyMXYtMmE0IDQgMCAwIDAtNC00SDhhNCA0IDAgMCAwLTQgNHYyIj48L3BhdGg+PGNpcmNsZSBjeD0iMTIiIGN5PSI3IiByPSI0Ij48L2NpcmNsZT48L3N2Zz4=" alt="Profile">
                        </div>
                        <h2 id="profileDetailedName" style="color: #fff; margin: 15px 0 5px 0; font-size: 24px;">STUDENT NAME</h2>
                        <span class="badge bg-green" id="profileDetailedRegNo" style="font-size:12px; padding:4px 12px; border-radius:20px;">REG: 000000</span>
                        
                        <div style="text-align: left; background: #1e1e24; border-radius: 8px; padding: 20px; border: 1px solid #3f3f46; margin-top: 25px;">
                            <p style="margin: 0 0 10px 0; font-size: 13px; color: #a1a1aa;"><strong>Email Address:</strong> <br><span id="profileDetailedEmail" style="color: #c9d1d9; font-size: 15px;">student@email.com</span></p>
                            <p style="margin: 0; font-size: 13px; color: #a1a1aa;"><strong>System Username:</strong> <br><span id="profileDetailedUserId" style="color: #c9d1d9; font-size: 15px;">username123</span></p>
                        </div>
                    </div>
                </div>

                <!-- 3. MY RESULTS VIEW -->
                <div id="view-results" class="admin-view">
                    <h2 class="page-title mb-20">My Performance History</h2>
                    <div class="dark-panel">
                        <div class="table-responsive" id="studentAttemptsTable"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            const name = localStorage.getItem('name') || localStorage.getItem('userId') || 'STUDENT';
            const regNo = localStorage.getItem('regNo') || 'N/A';
            const pic = localStorage.getItem('profilePic');
            
            document.getElementById('studentNameDisplay').innerText = name.toUpperCase();
            document.getElementById('admissionIdDisplay').innerText = "Reg No: " + regNo;
            if(pic) document.getElementById('topNavProfilePic').src = pic;

            if(typeof loadStudentPortal === 'function') loadStudentPortal();
        };
    </script>
</body>
</html>
