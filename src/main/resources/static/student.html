<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | GlassQuiz</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-light-body">
    
    <div class="spik-layout">
        
        <!-- SIDEBAR -->
        <aside class="spik-sidebar" id="sidebar">
            <div class="sidebar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#10b981"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <h2>Glass<span>Student</span></h2>
                <button class="mobile-close" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="sidebar-menu">
                <p class="menu-label">MY PORTAL</p>
                <a href="#" class="menu-item active" onclick="switchView('view-dashboard', this)">
                    <span>🏠</span> Dashboard
                </a>
                <a href="#" class="menu-item" onclick="switchView('view-results', this); loadStudentAttempts();">
                    <span>📊</span> My Results
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="spik-main">
            
            <!-- TOP NAVBAR -->
            <nav class="spik-navbar">
                <div class="nav-left">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                </div>
                <div class="nav-right">
                    <div class="admin-profile">
                        <img id="topNavProfilePic" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYTBhYWJmIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik0yMCAyMXYtMmE0IDQgMCAwIDAtNC00SDhhNCA0IDAgMCAwLTQgNHYyIj48L3BhdGg+PGNpcmNsZSBjeD0iMTIiIGN5PSI3IiByPSI0Ij48L2NpcmNsZT48L3N2Zz4=" alt="Student">
                        <div class="admin-info">
                            <strong id="studentNameDisplay">STUDENT</strong>
                            <span id="admissionIdDisplay">Reg No: 0000000</span>
                        </div>
                    </div>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </nav>

            <!-- DYNAMIC VIEWS -->
            <div class="spik-content">
                
                <!-- 1. DASHBOARD VIEW (Tests) -->
                <div id="view-dashboard" class="admin-view active">
                    <h2 class="page-title">Available Examinations</h2>
                    
                    <div class="dash-card mb-20">
                        <div class="card-header">
                            <h3>Live Tests</h3>
                        </div>
                        <div class="stats-grid" id="liveTestsContainer"></div>
                    </div>

                    <div class="dash-card">
                        <div class="card-header">
                            <h3>Upcoming Tests</h3>
                        </div>
                        <div class="stats-grid" id="upcomingTestsContainer"></div>
                    </div>
                </div>

                <!-- 2. MY RESULTS VIEW -->
                <div id="view-results" class="admin-view">
                    <h2 class="page-title">My Performance History</h2>
                    <div class="dash-card">
                        <div class="table-responsive" id="studentAttemptsTable"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            const name = localStorage.getItem('name') || localStorage.getItem('userId') || 'STUDENT';
            const regNo = localStorage.getItem('regNo') || 'N/A';
            const pic = localStorage.getItem('profilePic');
            
            document.getElementById('studentNameDisplay').innerText = name.toUpperCase();
            document.getElementById('admissionIdDisplay').innerText = "Reg No: " + regNo;
            if(pic) document.getElementById('topNavProfilePic').src = pic;

            if(typeof loadStudentPortal === 'function') loadStudentPortal();
        };
    </script>
</body>
</html>
