<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Engine</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="jee-body">

    <!-- TOP HEADER -->
    <header class="jee-header">
        <div class="jee-title" id="examMainTitle">Loading Exam...</div>
        
        <div class="jee-header-right">
            <div class="jee-action-btn">
                <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.42l5.07 5.07"/></svg>
                <span>Sync<br><small>Last Sync : Just now</small></span>
            </div>
            <div class="jee-action-btn" onclick="toggleInstructions()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>Instructions</span>
            </div>
            <div class="jee-action-btn">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                <span>Question Paper</span>
            </div>
            
            <div class="jee-timer-box">
                <div class="timer-label">Time remaining</div>
                <div class="timer-pill" id="timeRemaining">00:00:00</div>
            </div>
            
            <div class="jee-profile">
                <div id="studentBadgeName" class="p-name">STUDENT</div>
                <div id="studentBadgeId" class="p-id">0000000</div>
            </div>
        </div>
    </header>

    <!-- INSTRUCTIONS MODAL (Hidden by default) -->
    <div id="instructionsModal" class="jee-modal hidden">
        <div class="jee-modal-content">
            <h2>Exam Instructions</h2>
            <div id="instructionContent" class="instruction-text"></div>
            <button class="btn-submit" onclick="toggleInstructions()" style="margin-top: 20px;">Close & Return to Exam</button>
        </div>
    </div>

    <!-- MAIN CBT LAYOUT -->
    <div class="jee-main-layout">
        
        <!-- LEFT PANEL (Questions) -->
        <div class="jee-left-panel">
            
            <!-- Sections Bar -->
            <div class="jee-sections-wrapper">
                <span class="sec-arrow">❮</span>
                <div class="jee-sections" id="sectionsBar"></div>
                <span class="sec-arrow">❯</span>
            </div>

            <!-- Question Area -->
            <div class="jee-question-area">
                <div class="q-meta-header">
                    <span class="q-number" id="qNumberDisplay">Question 1</span>
                    <span class="q-type-badge">Single Select Type</span>
                </div>
                
                <div class="q-divider"></div>
                
                <div class="q-content-box">
                    <div id="questionText" class="q-text"></div>
                    <div id="questionImageContainer"></div>
                </div>
                
                <div class="q-options-box">
                    <label class="jee-opt-row"><input type="radio" name="examOpt" value="A"> <span id="optAText"></span></label>
                    <label class="jee-opt-row"><input type="radio" name="examOpt" value="B"> <span id="optBText"></span></label>
                    <label class="jee-opt-row"><input type="radio" name="examOpt" value="C"> <span id="optCText"></span></label>
                    <label class="jee-opt-row"><input type="radio" name="examOpt" value="D"> <span id="optDText"></span></label>
                </div>
            </div>

            <!-- Footer Action Buttons -->
            <div class="jee-footer">
                <div class="footer-row-top">
                    <div style="display:flex; gap:10px;">
                        <button class="btn-save-next" onclick="saveAndNext()">SAVE & NEXT</button>
                        <button class="btn-save-mark" onclick="saveAndMark()">SAVE & MARK FOR REVIEW</button>
                    </div>
                    <button class="btn-clear" onclick="clearResponse()">CLEAR RESPONSE</button>
                </div>
                <div class="footer-row-bottom">
                    <div style="display:flex; gap:10px;">
                        <button class="btn-nav" onclick="prevQuestion()">&#8592; BACK</button>
                        <button class="btn-nav" onclick="nextQuestion()">NEXT &#8594;</button>
                    </div>
                    <button class="btn-submit" onclick="submitExamFinal()">SUBMIT</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (Palette) -->
        <div class="jee-right-panel">
            <div class="palette-header">QUESTION STATUS</div>
            
            <div class="palette-legend-grid">
                <div class="leg-item"><div class="badge badge-nv" id="count-nv">0</div> Not Visited</div>
                <div class="leg-item"><div class="badge badge-na" id="count-na">0</div> Not Answered</div>
                <div class="leg-item"><div class="badge badge-ans" id="count-ans">0</div> Answered</div>
                <div class="leg-item"><div class="badge badge-mr" id="count-mr">0</div> Marked for Review</div>
                <div class="leg-item" style="grid-column: span 2;"><div class="badge badge-amr" id="count-amr">0</div> Answered & Marked for Review</div>
            </div>

            <div class="palette-header" style="margin-top: 15px;">CHOOSE A QUESTION</div>
            <div class="jee-q-grid" id="questionGrid"></div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            const name = localStorage.getItem('name') || localStorage.getItem('userId') || 'STUDENT';
            const regNo = localStorage.getItem('regNo') || 'N/A';
            document.getElementById('studentBadgeName').innerText = name.toUpperCase();
            document.getElementById('studentBadgeId').innerText = regNo;
            loadExamEngine();
        }
    </script>
</body>
</html>
